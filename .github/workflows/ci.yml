name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-action:
    name: GitHub Actions Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
      - name: Scaffold minimal Capacitor app
        run: |
          set -euo pipefail
          mkdir -p test-app
          cd test-app
          npm init -y > /dev/null
          npm install --silent @capacitor/core @capacitor/cli
          npx cap init ci-test-app io.capawesome.citest --web-dir www
          mkdir -p www
          echo '<!doctype html><title>CI</title><h1>CI</h1>' > www/index.html
          npm pkg set scripts.build='mkdir -p www && echo "<h1>CI</h1>" > www/index.html'
      - name: Test Local Action
        uses: ./
        id: test-action
        with:
          appId: ${{ secrets.CAPAWESOME_APP_ID }}
          platform: 'web'
          path: 'test-app'
          token: ${{ secrets.CAPAWESOME_TOKEN }}
      - name: Print Outputs
        run: |
          echo "Build ID: ${{ steps.test-action.outputs.buildId }}"
          echo "Build Number: ${{ steps.test-action.outputs.buildNumber }}"
          echo "Build URL: ${{ steps.test-action.outputs.buildUrl }}"
