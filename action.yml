name: 'Capawesome Cloud Build Action for GitHub Actions'
description: 'Trigger Mobile Builds with Capawesome Cloud.'
author: 'Robin Genz <mail@robingenz.dev>'

branding:
  icon: 'arrow-up-circle'
  color: 'purple'

inputs:
  appId:
    description: 'The Capawesome Cloud app ID.'
    required: true
  aab:
    description: 'Download the generated AAB file (Android only). Set to `true` or provide a file path.'
  apk:
    description: 'Download the generated APK file (Android only). Set to `true` or provide a file path.'
  certificate:
    description: 'The name of the certificate to use for the build.'
  channel:
    description: 'The name of the channel to deploy to (Web only). Cannot be combined with `destination`.'
  destination:
    description: 'The name of the destination to deploy to (Android/iOS only). Cannot be combined with `channel`.'
  detached:
    description: 'Exit immediately after creating the build without waiting for completion. Set to `true` to enable.'
  environment:
    description: 'The name of the environment to use for the build.'
  gitRef:
    description: 'The Git reference (branch, tag, or commit SHA) to build. Cannot be combined with `path` or `url`.'
  ipa:
    description: 'Download the generated IPA file (iOS only). Set to `true` or provide a file path.'
  path:
    description: 'Path to local source files to upload. Must be a folder or a zip file. Cannot be combined with `gitRef` or `url`.'
  platform:
    description: 'The platform for the build. Must be `ios`, `android`, or `web`.'
  share:
    description: 'Create a public share link for the build. Not compatible with `detached`. Set to `true` to enable.'
  shareDescription:
    description: 'Additional information shown on the public share page, e.g. what to test.'
  shareExpiresInDays:
    description: 'The number of days until the share link expires.'
  stack:
    description: 'The build stack to use. Must be `macos-sequoia` or `macos-tahoe`.'
  token:
    description: 'The Capawesome Cloud API token.'
    required: true
  type:
    description: 'The type of build. iOS: `simulator`, `development`, `ad-hoc`, `app-store`, `enterprise`. Android: `debug`, `release`.'
  url:
    description: 'URL to a zip file to use as build source. Cannot be combined with `gitRef` or `path`.'
  variables:
    description: 'Ad hoc environment variables, one `key=value` pair per line.'
  variableFile:
    description: 'Path to a file containing ad hoc environment variables in `.env` format.'
  zip:
    description: 'Download the generated ZIP file (Web only). Set to `true` or provide a file path.'

outputs:
  buildId:
    description: 'The ID of the created build.'
    value: ${{ steps.build.outputs.build-id }}
  buildNumber:
    description: 'The build number.'
    value: ${{ steps.build.outputs.build-number }}
  buildUrl:
    description: 'The URL to the build in the Capawesome Cloud Console.'
    value: ${{ steps.build.outputs.build-url }}
  shareUrl:
    description: 'The URL to the public share page for the build.'
    value: ${{ steps.build.outputs.share-url }}
  shareQrCodeUrl:
    description: 'The URL to a QR code image (PNG) encoding the public share page.'
    value: ${{ steps.build.outputs.share-qr-code-url }}
  shareExpiresAt:
    description: 'The ISO 8601 timestamp when the share link expires, if set.'
    value: ${{ steps.build.outputs.share-expires-at }}

runs:
  using: composite
  steps:
    - name: Mask secrets
      shell: bash
      env:
        CAPAWESOME_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        mask() {
          local line escaped
          while IFS= read -r line; do
            if [ -z "$line" ]; then continue; fi
            escaped="${line//%/%25}"
            escaped="${escaped//$'\r'/%0D}"
            echo "::add-mask::$escaped"
          done <<< "$1"
        }
        mask "$CAPAWESOME_TOKEN"
    - name: Create build
      id: build
      shell: bash
      env:
        CAPAWESOME_TOKEN: ${{ inputs.token }}
        APP_ID: ${{ inputs.appId }}
        AAB: ${{ inputs.aab }}
        APK: ${{ inputs.apk }}
        CERTIFICATE: ${{ inputs.certificate }}
        CHANNEL: ${{ inputs.channel }}
        DESTINATION: ${{ inputs.destination }}
        DETACHED: ${{ inputs.detached }}
        ENVIRONMENT: ${{ inputs.environment }}
        GIT_REF: ${{ inputs.gitRef }}
        IPA: ${{ inputs.ipa }}
        SOURCE_PATH: ${{ inputs.path }}
        PLATFORM: ${{ inputs.platform }}
        SHARE: ${{ inputs.share }}
        SHARE_DESCRIPTION: ${{ inputs.shareDescription }}
        SHARE_EXPIRES_IN_DAYS: ${{ inputs.shareExpiresInDays }}
        STACK: ${{ inputs.stack }}
        TYPE: ${{ inputs.type }}
        URL: ${{ inputs.url }}
        VARIABLES: ${{ inputs.variables }}
        VARIABLE_FILE: ${{ inputs.variableFile }}
        ZIP: ${{ inputs.zip }}
      run: |
        set -euo pipefail
        args=(apps:builds:create --app-id "$APP_ID" --json --yes)
        if [ -n "$PLATFORM" ];      then args+=(--platform "$PLATFORM"); fi
        if [ -n "$TYPE" ];          then args+=(--type "$TYPE"); fi
        if [ -n "$GIT_REF" ];       then args+=(--git-ref "$GIT_REF"); fi
        if [ -n "$SOURCE_PATH" ];   then args+=(--path "$SOURCE_PATH"); fi
        if [ -n "$URL" ];           then args+=(--url "$URL"); fi
        if [ -n "$ENVIRONMENT" ];   then args+=(--environment "$ENVIRONMENT"); fi
        if [ -n "$CERTIFICATE" ];   then args+=(--certificate "$CERTIFICATE"); fi
        if [ -n "$STACK" ];         then args+=(--stack "$STACK"); fi
        if [ -n "$CHANNEL" ];       then args+=(--channel "$CHANNEL"); fi
        if [ -n "$DESTINATION" ];   then args+=(--destination "$DESTINATION"); fi
        if [ -n "$VARIABLE_FILE" ]; then args+=(--variable-file "$VARIABLE_FILE"); fi
        if [ "$DETACHED" = "true" ]; then args+=(--detached); fi
        if [ "$SHARE" = "true" ]; then args+=(--share); fi
        if [ -n "$SHARE_DESCRIPTION" ];    then args+=(--share-description "$SHARE_DESCRIPTION"); fi
        if [ -n "$SHARE_EXPIRES_IN_DAYS" ]; then args+=(--share-expires-in-days "$SHARE_EXPIRES_IN_DAYS"); fi
        if [ "$APK" = "true" ]; then args+=(--apk); elif [ -n "$APK" ]; then args+=(--apk "$APK"); fi
        if [ "$AAB" = "true" ]; then args+=(--aab); elif [ -n "$AAB" ]; then args+=(--aab "$AAB"); fi
        if [ "$IPA" = "true" ]; then args+=(--ipa); elif [ -n "$IPA" ]; then args+=(--ipa "$IPA"); fi
        if [ "$ZIP" = "true" ]; then args+=(--zip); elif [ -n "$ZIP" ]; then args+=(--zip "$ZIP"); fi
        while IFS= read -r variable; do
          if [ -n "$variable" ]; then args+=(--variable "$variable"); fi
        done <<< "$VARIABLES"
        output_file="$(mktemp)"
        npx -y @capawesome/cli@4.16.0 "${args[@]}" | tee "$output_file"
        json="$(sed -n '/^{/,$p' "$output_file")"
        build_id="$(printf '%s' "$json" | jq -r '.id // empty')"
        build_number="$(printf '%s' "$json" | jq -r '.numberAsString // empty')"
        share_url="$(printf '%s' "$json" | jq -r '.share.url // empty')"
        share_qr_code_url="$(printf '%s' "$json" | jq -r '.share.qrCodeUrl // empty')"
        share_expires_at="$(printf '%s' "$json" | jq -r '.share.expiresAt // empty')"
        {
          echo "build-id=$build_id"
          echo "build-number=$build_number"
          if [ -n "$build_id" ]; then
            echo "build-url=https://console.cloud.capawesome.io/apps/$APP_ID/builds/$build_id"
          fi
          echo "share-url=$share_url"
          echo "share-qr-code-url=$share_qr_code_url"
          echo "share-expires-at=$share_expires_at"
        } >> "$GITHUB_OUTPUT"
